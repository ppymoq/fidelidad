<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fidelidad Mi Negocio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  
  <!-- Cargar Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Cargar SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

  <header class="w-full max-w-md bg-indigo-600 text-white p-4 rounded-b-2xl shadow-lg text-center">
    <h1 class="text-2xl font-bold">Mi Negocio ⭐</h1>
    <p class="text-xs text-indigo-200">Tarjeta Digital de Puntos</p>
  </header>

  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 my-auto text-center border border-gray-100">
    
    <!-- Login / Registro por Teléfono -->
    <div id="login-section" class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Ingresa tu Celular</h2>
      <input id="phone-input" type="tel" placeholder="Ej: 987654321" class="w-full p-3 border border-gray-300 rounded-xl text-center font-bold text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button id="btn-entrar" onclick="buscarOBuscarCliente()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-indigo-700 transition">
        Entrar / Consultar Puntos
      </button>
    </div>

    <!-- Vista de Estrellas -->
    <div id="card-section" class="hidden">
      <p class="text-xs text-gray-400 font-mono mb-1" id="user-phone"></p>
      
      <!-- Contenedor visual de las estrellas -->
      <div id="stars-container" class="flex justify-center gap-2 mb-6 text-3xl"></div>

      <div id="reward-banner" class="hidden bg-green-100 border border-green-300 text-green-800 p-4 rounded-2xl mb-4 animate-bounce">
        <p class="font-bold">🎉 ¡Ganaste un Premio!</p>
        <p class="text-xs">Muestra esta pantalla en caja para canjearlo.</p>
        <button onclick="canjearPremio()" class="mt-3 bg-green-600 text-white font-semibold py-2 px-6 rounded-xl hover:bg-green-700">Canjear</button>
      </div>

      <p class="text-sm font-medium text-indigo-600">Llevas <span id="star-count">0</span>/5 estrellas</p>
      <button onclick="cerrarSesion()" class="mt-4 text-xs text-gray-400 underline block mx-auto">Cambiar de número</button>
    </div>

  </main>

  <!-- Panel Admin (Para marcar estrellas en la caja) -->
  <section class="w-full max-w-md bg-gray-900 text-white p-4 rounded-2xl text-center mb-2">
    <p class="text-xs text-gray-400 font-mono mb-2">--- CAJA / ADMIN ---</p>
    <button onclick="marcarConsumoAdmin()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-4 rounded-xl text-sm transition">
      +1 Estrella a este Cliente
    </button>
  </section>

<script>
  const SUPABASE_URL = 'https://rkrtcsezfxmxnrxwgtgd.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrcnRjc2V6ZnhteG5yeHdndGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTA5ODcsImV4cCI6MjA0MjY2MzAwOX0.3HTK3ddlnVdHcnaMYr3g4vlpWvNd9gkGyn04rrCLDuA';
  
  let supabase = null;
  if (window.supabase) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  let clienteActual = null;

  async function buscarOBuscarCliente() {
    if (!supabase) {
      return alert('Error: No se pudo cargar la librería de Supabase. Revisa tu conexión.');
    }

    const telInput = document.getElementById('phone-input');
    const tel = telInput.value.trim();
    if (!tel) return alert('Ingresa un número de celular');

    const btn = document.getElementById('btn-entrar');
    btn.disabled = true;
    btn.textContent = 'Cargando...';

    try {
      // 1. Buscar si el cliente existe
      let { data, error } = await supabase
        .from('clientes')
        .select('*')
        .eq('telefono', tel)
        .maybeSingle();

      if (error) throw error;

      // 2. Si no existe, crearlo
      if (!data) {
        const { data: nuevo, error: createError } = await supabase
          .from('clientes')
          .insert([{ telefono: tel, estrellas: 0 }])
          .select()
          .single();

        if (createError) throw createError;
        data = nuevo;
      }

      clienteActual = data;
      mostrarTarjeta();

    } catch (err) {
      console.error('Detalle del error:', err);
      alert('Error de conexión o estructura en Supabase:\n' + (err.message || JSON.stringify(err)));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar / Consultar Puntos';
    }
  }

  function mostrarTarjeta() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('card-section').classList.remove('hidden');
    document.getElementById('user-phone').textContent = `Cliente: ${clienteActual.telefono}`;
    
    actualizarVistaEstrellas();
  }

  function actualizarVistaEstrellas() {
    const estrellas = clienteActual.estrellas || 0;
    document.getElementById('star-count').textContent = estrellas;

    const container = document.getElementById('stars-container');
    container.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      if (i <= estrellas) {
        container.innerHTML += '<span class="text-yellow-400">★</span>';
      } else {
        container.innerHTML += '<span class="text-gray-300">☆</span>';
      }
    }

    const banner = document.getElementById('reward-banner');
    if (estrellas >= 5) {
      banner.classList.remove('hidden');
    } else {
      banner.classList.add('hidden');
    }
  }

  async function marcarConsumoAdmin() {
    if (!clienteActual) {
      return alert('Primero debes consultar un cliente con su número de celular.');
    }

    const nuevasEstrellas = (clienteActual.estrellas || 0) + 1;

    try {
      const { data, error } = await supabase
        .from('clientes')
        .update({ estrellas: nuevasEstrellas })
        .eq('id', clienteActual.id)
        .select()
        .single();

      if (error) throw error;

      clienteActual = data;
      actualizarVistaEstrellas();
      alert(`¡+1 Estrella agregada a ${clienteActual.telefono}!`);
    } catch (err) {
      alert('Error al actualizar estrellas:\n' + (err.message || JSON.stringify(err)));
    }
  }

  async function canjearPremio() {
    if (!clienteActual) return;

    try {
      const { data, error } = await supabase
        .from('clientes')
        .update({ estrellas: 0 })
        .eq('id', clienteActual.id)
        .select()
        .single();

      if (error) throw error;

      clienteActual = data;
      actualizarVistaEstrellas();
      alert('🎉 ¡Premio canjeado con éxito! La tarjeta se ha reiniciado.');
    } catch (err) {
      alert('Error al canjear premio:\n' + (err.message || JSON.stringify(err)));
    }
  }

  function cerrarSesion() {
    clienteActual = null;
    document.getElementById('phone-input').value = '';
    document.getElementById('card-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
  }
</script>
</body>
</html>
