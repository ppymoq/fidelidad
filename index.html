<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fidelidad Mi Negocio</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

  <header class="w-full max-w-md bg-indigo-600 text-white p-4 rounded-b-2xl shadow-lg text-center">
    <h1 class="text-2xl font-bold">Mi Negocio ⭐</h1>
    <p class="text-xs text-indigo-200">Tarjeta Digital de Puntos</p>
  </header>

  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 my-auto text-center border border-gray-100">
    
    <!-- Login / Registro -->
    <div id="login-section" class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Ingresa tus Datos</h2>
      <input id="name-input" type="text" placeholder="Tu Nombre y Apellido" class="w-full p-3 border border-gray-300 rounded-xl text-center font-semibold text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <input id="phone-input" type="tel" placeholder="Número Celular (Ej: 987654321)" class="w-full p-3 border border-gray-300 rounded-xl text-center font-bold text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button id="btn-entrar" onclick="buscarOBuscarCliente()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-indigo-700 transition">
        Entrar / Consultar Puntos
      </button>
    </div>

    <!-- Vista de Estrellas -->
    <div id="card-section" class="hidden">
      <h2 class="text-xl font-bold text-gray-800 mb-1" id="user-name">Hola, Cliente</h2>
      <p class="text-xs text-gray-400 font-mono mb-4" id="user-phone"></p>
      
      <div id="stars-container" class="flex justify-center gap-2 mb-6 text-3xl"></div>

      <div id="reward-banner" class="hidden bg-green-100 border border-green-300 text-green-800 p-4 rounded-2xl mb-4">
        <p class="font-bold">🎉 ¡Ganaste un Premio!</p>
        <p class="text-xs">Muestra esta pantalla en caja para canjearlo.</p>
      </div>

      <p class="text-sm font-medium text-indigo-600">Llevas <span id="star-count">0</span>/5 estrellas</p>
      <button onclick="cerrarSesion()" class="mt-4 text-xs text-gray-400 underline block mx-auto">Cambiar de usuario</button>
    </div>

  </main>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW:', err));
  }

  const SUPABASE_URL = 'https://rkrtcsezfxmxnrxwgtgd.supabase.co';
  const SUPABASE_KEY = 'PEGA_AQUI_TU_CLAVE_PUBLISHABLE'; 
  const LOGO_URL = 'logo.png'; 

  let db = null;
  if (window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  let clienteActual = null;

  async function buscarOBuscarCliente() {
    if (!db) return alert('No se pudo cargar la librería de Supabase.');

    const nameInput = document.getElementById('name-input');
    const telInput = document.getElementById('phone-input');
    const nombre = nameInput.value.trim();
    const tel = telInput.value.trim();

    if (!tel) return alert('Ingresa tu número de celular');

    const btn = document.getElementById('btn-entrar');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
      let { data, error } = await db.from('clientes').select('*').eq('telefono', tel);
      if (error) throw error;

      if (!data || data.length === 0) {
        if (!nombre) {
          alert('Por favor ingresa tu nombre para registrarte.');
          btn.disabled = false;
          btn.textContent = 'Entrar / Consultar Puntos';
          return;
        }

        const { data: nuevoCliente, error: insertError } = await db
          .from('clientes')
          .insert([{ nombre: nombre, telefono: tel, estrellas: 0 }])
          .select();

        if (insertError) throw insertError;
        clienteActual = nuevoCliente[0];
      } else {
        clienteActual = data[0];
        if (nombre && !clienteActual.nombre) {
          await db.from('clientes').update({ nombre: nombre }).eq('id', clienteActual.id);
          clienteActual.nombre = nombre;
        }
      }

      mostrarTarjeta();

    } catch (err) {
      alert('Error: ' + (err.message || JSON.stringify(err)));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar / Consultar Puntos';
    }
  }

  function mostrarTarjeta() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('card-section').classList.remove('hidden');
    document.getElementById('user-name').textContent = clienteActual.nombre ? `¡Hola, ${clienteActual.nombre}!` : '¡Bienvenido!';
    document.getElementById('user-phone').textContent = `Celular: ${clienteActual.telefono}`;
    actualizarVistaEstrellas();
  }

  function actualizarVistaEstrellas() {
    const estrellas = clienteActual.estrellas || 0;
    document.getElementById('star-count').textContent = estrellas;

    const container = document.getElementById('stars-container');
    container.innerHTML = '';

    for (let i = 1; i <= 5; i++) {
      if (i <= estrellas) {
        container.innerHTML += `<img src="${LOGO_URL}" alt="Punto acumulado" class="w-12 h-12 object-contain transition-all transform scale-110 drop-shadow-md">`;
      } else {
        container.innerHTML += `<img src="${LOGO_URL}" alt="Punto pendiente" class="w-12 h-12 object-contain opacity-25 grayscale">`;
      }
    }

    const banner = document.getElementById('reward-banner');
    if (estrellas >= 5) banner.classList.remove('hidden');
    else banner.classList.add('hidden');
  }

  function cerrarSesion() {
    clienteActual = null;
    document.getElementById('phone-input').value = '';
    document.getElementById('name-input').value = '';
    document.getElementById('card-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
  }
</script>
</body>
</html>
