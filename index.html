<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fidelidad Mi Negocio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 16px; }
    header { width: 100%; max-width: 400px; background-color: #4f46e5; color: white; padding: 16px; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    header h1 { font-size: 1.5rem; font-weight: bold; }
    header p { font-size: 0.75rem; color: #c7d2fe; }
    main { width: 100%; max-width: 400px; background-color: white; border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 24px; margin: auto 0; text-align: center; border: 1px solid #f3f4f6; }
    .space-y-4 > * + * { margin-top: 16px; }
    h2 { font-size: 1.125rem; font-weight: 600; color: #374151; }
    input[type="tel"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 12px; text-align: center; font-weight: bold; font-size: 1.125rem; outline: none; }
    input[type="tel"]:focus { border-color: #4f46e5; ring: 2px #4f46e5; }
    .btn-primary { width: 100%; background-color: #4f46e5; color: white; font-weight: 600; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-size: 1rem; }
    .btn-primary:hover { background-color: #4338ca; }
    .hidden { display: none !important; }
    .stars { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; font-size: 2.25rem; }
    .star-filled { color: #facc15; }
    .star-empty { color: #d1d5db; }
    .reward-banner { background-color: #dcfce7; border: 1px solid #86efac; color: #166534; padding: 16px; border-radius: 16px; margin-bottom: 16px; }
    .reward-banner p.title { font-weight: bold; }
    .reward-banner p.sub { font-size: 0.75rem; }
    .btn-success { margin-top: 12px; background-color: #16a34a; color: white; font-weight: 600; padding: 8px 24px; border-radius: 12px; border: none; cursor: pointer; }
    .text-status { font-size: 0.875rem; font-weight: 500; color: #4f46e5; }
    .btn-link { margin-top: 16px; font-size: 0.75rem; color: #9ca3af; text-decoration: underline; background: none; border: none; cursor: pointer; display: block; margin-left: auto; margin-right: auto; }
    section.admin { width: 100%; max-width: 400px; background-color: #111827; color: white; padding: 16px; border-radius: 16px; text-align: center; margin-bottom: 8px; }
    section.admin p { font-size: 0.75rem; color: #9ca3af; font-family: monospace; margin-bottom: 8px; }
    .btn-warning { background-color: #eab308; color: black; font-weight: bold; padding: 8px 16px; border-radius: 12px; font-size: 0.875rem; border: none; cursor: pointer; }
    .btn-warning:hover { background-color: #ca8a04; }
  </style>
</head>
<body>

  <header>
    <h1>Mi Negocio ⭐</h1>
    <p>Tarjeta Digital de Puntos</p>
  </header>

  <main>
    <!-- Login / Registro por Teléfono -->
    <div id="login-section" class="space-y-4">
      <h2>Ingresa tu Celular</h2>
      <input id="phone-input" type="tel" placeholder="Ej: 987654321">
      <button onclick="buscarOBuscarCliente()" class="btn-primary">
        Entrar / Consultar Puntos
      </button>
    </div>

    <!-- Vista de Estrellas -->
    <div id="card-section" class="hidden">
      <p style="font-size: 0.75rem; color: #9ca3af; font-family: monospace; margin-bottom: 4px;" id="user-phone"></p>
      
      <div id="stars-container" class="stars"></div>

      <div id="reward-banner" class="reward-banner hidden">
        <p class="title">🎉 ¡Ganaste un Premio!</p>
        <p class="sub">Muestra esta pantalla en caja para canjearlo.</p>
        <button onclick="canjearPremio()" class="btn-success">Canjear</button>
      </div>

      <p class="text-status">Llevas <span id="star-count">0</span>/5 estrellas</p>
      <button onclick="cerrarSesion()" class="btn-link">Cambiar de número</button>
    </div>
  </main>

  <!-- Panel Admin (Caja) -->
  <section class="admin">
    <p>--- CAJA / ADMIN ---</p>
    <button onclick="marcarConsumoAdmin()" class="btn-warning">
      +1 Estrella a este Cliente
    </button>
  </section>

<script>
  // --- CONFIGURACIÓN DE SUPABASE ---
  const SUPABASE_URL = 'https://tencujhgrbzruxikqljq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbmN1amhncmJ6cnV4aWtxbGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjcwODcwMDksImV4cCI6MjA0MjY2MzAwOX0.S0o0_G8...'; // Pega aquí tu clave anon public completa
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let clienteActual = null;

  async function buscarOBuscarCliente() {
    const telInput = document.getElementById('phone-input');
    const tel = telInput.value.trim();
    if (!tel) return alert('Ingresa un número de celular');

    try {
      let { data, error } = await supabase
        .from('clientes')
        .select('*')
        .eq('telefono', tel)
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        const { data: nuevo, error: createError } = await supabase
          .from('clientes')
          .insert([{ telefono: tel, estrellas: 0 }])
          .select()
          .single();

        if (createError) throw createError;
        data = nuevo;
      }

      clienteActual = data;
      mostrarTarjeta();

    } catch (err) {
      console.error(err);
      alert('Error al conectar: ' + err.message);
    }
  }

  function mostrarTarjeta() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('card-section').classList.remove('hidden');
    document.getElementById('user-phone').textContent = `Cliente: ${clienteActual.telefono}`;
    actualizarVistaEstrellas();
  }

  function actualizarVistaEstrellas() {
    const estrellas = clienteActual.estrellas || 0;
    document.getElementById('star-count').textContent = estrellas;

    const container = document.getElementById('stars-container');
    container.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      if (i <= estrellas) {
        container.innerHTML += '<span class="star-filled">★</span>';
      } else {
        container.innerHTML += '<span class="star-empty">☆</span>';
      }
    }

    const banner = document.getElementById('reward-banner');
    if (estrellas >= 5) {
      banner.classList.remove('hidden');
    } else {
      banner.classList.add('hidden');
    }
  }

  async function marcarConsumoAdmin() {
    if (!clienteActual) {
      return alert('Primero debes consultar un cliente con su número de celular.');
    }

    const nuevasEstrellas = (clienteActual.estrellas || 0) + 1;

    try {
      const { data, error } = await supabase
        .from('clientes')
        .update({ estrellas: nuevasEstrellas })
        .eq('id', clienteActual.id)
        .select()
        .single();

      if (error) throw error;

      clienteActual = data;
      actualizarVistaEstrellas();
      alert(`¡+1 Estrella agregada a ${clienteActual.telefono}!`);
    } catch (err) {
      alert('Error al actualizar estrellas: ' + err.message);
    }
  }

  async function canjearPremio() {
    if (!clienteActual) return;

    try {
      const { data, error } = await supabase
        .from('clientes')
        .update({ estrellas: 0 })
        .eq('id', clienteActual.id)
        .select()
        .single();

      if (error) throw error;

      clienteActual = data;
      actualizarVistaEstrellas();
      alert('🎉 ¡Premio canjeado con éxito!');
    } catch (err) {
      alert('Error al canjear premio: ' + err.message);
    }
  }

  function cerrarSesion() {
    clienteActual = null;
    document.getElementById('phone-input').value = '';
    document.getElementById('card-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
  }
</script>
</body>
</html>
