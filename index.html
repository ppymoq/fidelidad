<script>
  // Registrar Service Worker para PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW:', err));
  }

  const SUPABASE_URL = 'https://rkrtcsezfxmxnrxwgtgd.supabase.co';
  const SUPABASE_KEY = 'PEGA_AQUI_TU_CLAVE_PUBLISHABLE'; 

  // 🖼️ URL DE TU LOGO (cámbiala por la ruta real de tu imagen)
  const LOGO_URL = 'logo.png'; 

  let db = null;
  if (window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  let clienteActual = null;

  async function buscarOBuscarCliente() {
    if (!db) return alert('No se pudo cargar la librería de Supabase.');

    const nameInput = document.getElementById('name-input');
    const telInput = document.getElementById('phone-input');
    
    const nombre = nameInput.value.trim();
    const tel = telInput.value.trim();

    if (!tel) return alert('Ingresa tu número de celular');

    const btn = document.getElementById('btn-entrar');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
      let { data, error } = await db
        .from('clientes')
        .select('*')
        .eq('telefono', tel);

      if (error) throw error;

      if (!data || data.length === 0) {
        if (!nombre) {
          alert('Por favor ingresa tu nombre para registrarte.');
          btn.disabled = false;
          btn.textContent = 'Entrar / Consultar Puntos';
          return;
        }

        const { data: nuevoCliente, error: insertError } = await db
          .from('clientes')
          .insert([{ nombre: nombre, telefono: tel, estrellas: 0 }])
          .select();

        if (insertError) throw insertError;
        clienteActual = nuevoCliente[0];
      } else {
        clienteActual = data[0];
        if (nombre && !clienteActual.nombre) {
          await db.from('clientes').update({ nombre: nombre }).eq('id', clienteActual.id);
          clienteActual.nombre = nombre;
        }
      }

      mostrarTarjeta();

    } catch (err) {
      alert('Error: ' + (err.message || JSON.stringify(err)));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar / Consultar Puntos';
    }
  }

  function mostrarTarjeta() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('card-section').classList.remove('hidden');
    
    document.getElementById('user-name').textContent = clienteActual.nombre ? `¡Hola, ${clienteActual.nombre}!` : '¡Bienvenido!';
    document.getElementById('user-phone').textContent = `Celular: ${clienteActual.telefono}`;
    
    actualizarVistaEstrellas();
  }

  function actualizarVistaEstrellas() {
    const estrellas = clienteActual.estrellas || 0;
    document.getElementById('star-count').textContent = estrellas;

    const container = document.getElementById('stars-container');
    container.innerHTML = '';

    for (let i = 1; i <= 5; i++) {
      if (i <= estrellas) {
        // Logo activo (A color y con brillo)
        container.innerHTML += `
          <img src="${LOGO_URL}" alt="Punto acumulado" class="w-12 h-12 object-contain transition-all transform scale-110 drop-shadow-md">
        `;
      } else {
        // Logo inactivo (En escala de grises y semi-transparente)
        container.innerHTML += `
          <img src="${LOGO_URL}" alt="Punto pendiente" class="w-12 h-12 object-contain opacity-25 grayscale">
        `;
      }
    }

    const banner = document.getElementById('reward-banner');
    if (estrellas >= 5) banner.classList.remove('hidden');
    else banner.classList.add('hidden');
  }

  async function marcarConsumoAdmin() {
    if (!clienteActual) return alert('Ingresa primero el número del cliente.');

    const nuevasEstrellas = (clienteActual.estrellas || 0) + 1;

    try {
      const { data, error } = await db
        .from('clientes')
        .update({ estrellas: nuevasEstrellas })
        .eq('id', clienteActual.id)
        .select();

      if (error) throw error;
      clienteActual = data[0];
      actualizarVistaEstrellas();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  async function canjearPremio() {
    if (!clienteActual) return;
    try {
      const { data, error } = await db
        .from('clientes')
        .update({ estrellas: 0 })
        .eq('id', clienteActual.id)
        .select();

      if (error) throw error;
      clienteActual = data[0];
      actualizarVistaEstrellas();
      alert('🎉 Premio canjeado con éxito');
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  function cerrarSesion() {
    clienteActual = null;
    document.getElementById('phone-input').value = '';
    document.getElementById('name-input').value = '';
    document.getElementById('card-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
  }
</script>
