<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fidelidad Mi Negocio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cliente de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-polyfill@9.0.0/dist/polyfill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

  <header class="w-full max-w-md bg-indigo-600 text-white p-4 rounded-b-2xl shadow-lg text-center">
    <h1 class="text-2xl font-bold">Mi Negocio ⭐</h1>
    <p class="text-xs text-indigo-200">Tarjeta Digital de Puntos</p>
  </header>

  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 my-auto text-center border border-gray-100">
    
    <!-- Login / Registro por Teléfono -->
    <div id="login-section" class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Ingresa tu Celular</h2>
      <input id="phone-input" type="tel" placeholder="Ej: 987654321" class="w-full p-3 border border-gray-300 rounded-xl text-center font-bold text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="buscarOBuscarCliente()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-indigo-700">
        Entrar / Consultar Puntos
      </button>
    </div>

    <!-- Vista de Estrellas -->
    <div id="card-section" class="hidden">
      <p class="text-xs text-gray-400 font-mono mb-1" id="user-phone"></p>
      <div id="stars-container" class="flex justify-center gap-2 mb-6"></div>

      <div id="reward-banner" class="hidden bg-green-100 border border-green-300 text-green-800 p-4 rounded-2xl mb-4 animate-bounce">
        <p class="font-bold">🎉 ¡Ganaste un Premio!</p>
        <p class="text-xs">Muestra esta pantalla en caja para canjearlo.</p>
        <button onclick="canjearPremio()" class="mt-3 bg-green-600 text-white font-semibold py-2 px-6 rounded-xl">Canjear</button>
      </div>

      <p class="text-sm font-medium text-indigo-600">Llevas <span id="star-count">0</span>/5 estrellas</p>
      <button onclick="cerrarSesion()" class="mt-4 text-xs text-gray-400 underline">Cambiar de número</button>
    </div>

  </main>

  <!-- Panel Admin (Para marcar estrellas en la caja) -->
  <section class="w-full max-w-md bg-gray-900 text-white p-4 rounded-2xl text-center mb-2">
    <p class="text-xs text-gray-400 font-mono mb-2">--- CAJA / ADMIN ---</p>
    <button onclick="marcarConsumoAdmin()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-4 rounded-xl text-sm">
      +1 Estrella a este Cliente
    </button>
  </section>

 <!-- Cargar la librería de Supabase (OBLIGATORIO) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // --- CONFIGURACIÓN DE SUPABASE ---
  const SUPABASE_URL = 'https://tencujhgrbzruxikqljq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbmN1amhncmJ6cnV4aWtxbGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjcwODcwMDksImV4cCI6MjA0MjY2MzAwOX0.S0o0_G8...'; // Tu clave completa
  
  // Inicialización del cliente
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let clienteActual = null;

  async function buscarOBuscarCliente() {
    const telInput = document.getElementById('phone-input');
    if (!telInput) return alert('No se encontró el campo de teléfono');
    
    const tel = telInput.value.trim();
    if (!tel) return alert('Ingresa un número de celular');

    try {
      // 1. Buscar si el cliente ya existe
      let { data, error } = await supabase
        .from('clientes')
        .select('*')
        .eq('telefono', tel)
        .maybeSingle();

      if (error) throw error;

      // 2. Si no existe, crearlo
      if (!data) {
        const { data: nuevo, error: createError } = await supabase
          .from('clientes')
          .insert([{ telefono: tel, estrellas: 0 }])
          .select()
          .single();

        if (createError) throw createError;
        data = nuevo;
      }

      // 3. Mostrar la tarjeta con los datos del cliente
      clienteActual = data;
      mostrarTarjeta();

    } catch (err) {
      console.error(err);
      alert('Error al conectar: ' + err.message);
    }
  }

  function mostrarTarjeta() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('card-section').classList.remove('hidden');
    document.getElementById('user-phone').textContent = `Cliente: ${clienteActual.telefono}`;
  }
</script>
</body>
</html>
