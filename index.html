<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broastería PoPeYe - Fidelidad</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

  <!-- Encabezado -->
  <header class="w-full max-w-md bg-indigo-600 text-white p-6 rounded-b-3xl shadow-xl text-center flex flex-col items-center justify-center mb-6">
    <div class="bg-white p-2 rounded-full shadow-md mb-3 flex items-center justify-center w-20 h-20">
      <img src="LOGO_FINAL.png" alt="Logo Broastería PoPeYe" class="w-full h-full object-contain rounded-full">
    </div>
    <h1 class="text-2xl font-extrabold tracking-wide flex items-center gap-2 justify-center">
      Broastería PoPeYe 🍗
    </h1>
    <p class="text-xs text-indigo-100 font-medium mt-2 leading-relaxed max-w-xs">
      ¡Porque te mereces lo mejor, premiamos tu preferencia en cada compra!
    </p>
    <p class="text-xs font-bold text-yellow-300 mt-1 bg-indigo-700/50 px-3 py-1 rounded-full border border-indigo-400/30">
      Pide, junta 5 PPY y canjea tu PREMIO! 🎁
    </p>
  </header>

  <!-- Contenedor Principal -->
  <main class="w-full max-w-md">
    
    <!-- Formulario de Login / Registro -->
    <section id="login-section" class="bg-white p-6 rounded-3xl shadow-lg text-center border border-gray-100">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Ingresa tu Celular</h2>
      
      <div class="space-y-4">
        <div>
          <input type="tel" id="input-phone" placeholder="Número Celular (Ej: 987654321)" class="w-full p-3 border border-gray-300 rounded-xl text-center text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div id="fields-new-user" class="hidden space-y-4">
          <input type="text" id="input-name" placeholder="Tu Nombre" class="w-full p-3 border border-gray-300 rounded-xl text-center text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <div>
            <label class="block text-xs text-gray-500 mb-1">Fecha de Nacimiento (Opcional)</label>
            <input type="date" id="input-dob" class="w-full p-3 border border-gray-300 rounded-xl text-center text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <button id="btn-login" onclick="procesarCliente()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200">
          Entrar / Consultar Puntos
        </button>
      </div>
    </section>

    <!-- Tarjeta de Puntos -->
    <section id="card-section" class="hidden bg-white p-6 rounded-3xl shadow-lg text-center border border-gray-100">
      <h2 id="user-name" class="text-2xl font-bold text-gray-800 mb-1">¡Hola!</h2>
      <p id="user-phone" class="text-sm text-gray-400 font-mono mb-6">Celular: ---</p>

      <!-- Contenedor de Logos (Logos acumulados) -->
      <div id="stars-container" class="flex justify-center items-center gap-2 mb-4">
        <!-- Generado dinámicamente -->
      </div>

      <p class="text-indigo-600 font-medium mb-6">Llevas <span id="star-count">0</span>/5 PPY</p>

      <div id="reward-banner" class="hidden bg-yellow-100 border border-yellow-400 text-yellow-800 p-3 rounded-2xl mb-4 text-sm font-bold animate-pulse">
        🎉 ¡Felicidades! Tienes un premio listo para canjear en tu próxima compra.
      </div>

      <button onclick="cambiarUsuario()" class="text-xs text-gray-400 underline hover:text-gray-600">
        Cambiar de usuario
      </button>
    </section>

  </main>

  <script>
    // Configuración Supabase
    const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co'; // Reemplazar con tu URL de Supabase
    const SUPABASE_ANON_KEY = 'TU-ANON-KEY'; // Reemplazar con tu ANON_KEY de Supabase
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let clienteActual = null;
    let esRegistroNuevo = false;

    async function procesarCliente() {
      const phoneInput = document.getElementById('input-phone').value.trim();
      const btn = document.getElementById('btn-login');

      if (!phoneInput) {
        alert('Por favor ingresa un número de celular');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Cargando...';

      try {
        if (!esRegistroNuevo) {
          // Buscar cliente por teléfono
          const { data, error } = await _supabase
            .from('clientes')
            .select('*')
            .eq('telefono', phoneInput)
            .maybeSingle();

          if (error) throw error;

          if (data) {
            clienteActual = data;
            mostrarTarjeta();
          } else {
            // No existe, mostrar campos de registro
            esRegistroNuevo = true;
            document.getElementById('fields-new-user').classList.remove('hidden');
            btn.textContent = 'Completar Registro';
          }
        } else {
          // Crear nuevo cliente
          const nameInput = document.getElementById('input-name').value.trim();
          const dobInput = document.getElementById('input-dob').value;

          if (!nameInput) {
            alert('Por favor ingresa tu nombre');
            return;
          }

          const { data, error } = await _supabase
            .from('clientes')
            .insert([{
              telefono: phoneInput,
              nombre: nameInput,
              fecha_nacimiento: dobInput || null,
              estrellas: 0
            }])
            .select()
            .single();

          if (error) throw error;

          clienteActual = data;
          mostrarTarjeta();
        }
      } catch (err) {
        alert('Error: ' + (err.message || JSON.stringify(err)));
      } finally {
        btn.disabled = false;
        if (!esRegistroNuevo) btn.textContent = 'Entrar / Consultar Puntos';
      }
    }

    function mostrarTarjeta() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('card-section').classList.remove('hidden');

      document.getElementById('user-name').textContent = clienteActual.nombre ? `¡Hola, ${clienteActual.nombre}!` : '¡Bienvenido!';
      document.getElementById('user-phone').textContent = `Celular: ${clienteActual.telefono}`;

      actualizarVistaEstrellas();
    }

    function actualizarVistaEstrellas() {
      const estrellas = clienteActual.estrellas || 0;
      document.getElementById('star-count').textContent = estrellas;

      const container = document.getElementById('stars-container');
      container.innerHTML = '';

      for (let i = 1; i <= 5; i++) {
        if (i <= estrellas) {
          container.innerHTML += '<img src="LOGO_FINAL.png" class="w-10 h-10 inline-block mx-1 object-contain">';
        } else {
          container.innerHTML += '<img src="LOGO_FINAL.png" class="w-10 h-10 inline-block mx-1 object-contain opacity-25 grayscale">';
        }
      }

      const banner = document.getElementById('reward-banner');
      if (estrellas >= 5) banner.classList.remove('hidden');
      else banner.classList.add('hidden');
    }

    function cambiarUsuario() {
      clienteActual = null;
      esRegistroNuevo = false;
      document.getElementById('input-phone').value = '';
      document.getElementById('input-name').value = '';
      document.getElementById('input-dob').value = '';
      document.getElementById('fields-new-user').classList.add('hidden');
      document.getElementById('btn-login').textContent = 'Entrar / Consultar Puntos';
      document.getElementById('card-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }
  </script>
</body>
</html>
